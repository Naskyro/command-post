# D1 binding is defined HERE (not in vite.config.ts) so wrangler CLI tools work:
#   npx wrangler d1 migrations apply site-creator-d1 --remote
#   npx wrangler d1 migrations apply site-creator-d1 --local
#
# R2 binding is defined ONLY in vite.config.ts (no bucket_name needed for migrations).
#
# NOTE: compatibility_flags are defined ONLY in vite.config.ts (nodejs_compat_v2,
# enable_weak_ref). Do NOT add them here — they would merge and cause:
# "nodejs_compat and nodejs_compat_v2 cannot be used together."

name = "command-post"
compatibility_date = "2024-09-23"
main = "./worker/index.ts"

[[d1_databases]]
binding = "DB"
database_name = "site-creator-d1"
database_id = "d1131c12-de19-4ff0-8164-68ea526b0fc3"
migrations_dir = "drizzle"
